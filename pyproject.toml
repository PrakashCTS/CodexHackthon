[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sdlc-control-tower"
version = "0.1.0"
description = "A local, human-governed Agentic SDLC workflow reference implementation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sdlc-control-tower = "control_tower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_tower = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
